name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  # dwl's main branch builds against the latest wlroots release
  # (`wlroots-0.20` in config.mk), which Ubuntu runners don't ship, so the
  # build runs in an Arch Linux container. Both variants compile: the
  # XWayland one turns on the `#ifdef XWAYLAND` code paths.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        xwayland: [false, true]
    steps:
      - run: >-
          pacman -Syu --noconfirm --needed
          wlroots0.20 wayland wayland-protocols libinput libxkbcommon
          libxcb xcb-util-wm pkgconf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - if: ${{ !matrix.xwayland }}
        run: make
      - if: ${{ matrix.xwayland }}
        run: make XWAYLAND=-DXWAYLAND XLIBS="xcb xcb-icccm"

  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: build=${{ needs.build.result }}
